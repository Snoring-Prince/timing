       GET /logos/{idType}/{id}     idType = isin | symbol | wkn | cik | lei

     미국 종목의 ISIN 은 "US" + CUSIP 아홉 자리 + 체크숫자입니다. 우리 자료에는

let LANG="en", L10N=D.en, LOCALE="en-US";

function pickLang(){
  const two=s=>String(s||"").slice(0,2).toLowerCase();
  try{ const q=two(new URLSearchParams(location.search).get("lang")); if(q&&D[q])return q; }catch(e){}
  try{ const s=localStorage.getItem("dt.lang"); if(s&&D[s])return s; }catch(e){}
  const navs=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||"en"];
  for(const l of navs){ const k=two(l); if(D[k])return k; }
  return "en";
}
function pickLocale(lang){
  const navs=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||""];
  for(const l of navs) if(String(l).slice(0,2).toLowerCase()===lang) return l;
  return D[lang].locale;
}
const tx=(k,...a)=>{ const v=(k in L10N)?L10N[k]:D.en[k]; return typeof v==="function"?v(...a):v; };

  padding-bottom:14px;margin-bottom:22px;border-bottom:2px solid var(--ink)}
.eyebrow{margin:0 0 6px;font-family:var(--cond);font-weight:600;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.masthead h1{margin:0;font-family:var(--cond);font-weight:700;font-size:30px;letter-spacing:-.01em;line-height:1.05}
.mast-right{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.stamp{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right}

/* ── 언어 탭 ─────────────────────────────────────────────── */
.seg{display:inline-flex;border:1px solid var(--rule);background:var(--card)}
.seg button{appearance:none;border:0;background:transparent;cursor:pointer;
  font-family:var(--cond);font-weight:600;font-size:11px;letter-spacing:.06em;
  color:var(--ink-2);padding:5px 10px;line-height:1.2}
.seg button+button{border-left:1px solid var(--rule-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* 차트 기간처럼 줄 안에 들어가는 버튼은 한 치수 작습니다. */
.seg.mini button{font-size:10px;letter-spacing:.08em;padding:3px 8px}
/* **이력보다 긴 기간은 눌리지 않습니다.** 감추지 않고 흐리게 둡니다 — 줄마다
   버튼 개수가 달라지면 목록의 세로줄이 들쭉날쭉해집니다. */
.seg button[disabled]{color:var(--ink-3);opacity:.45;cursor:default}

/* ── 패널 ───────────────────────────────────────────────── */
.panel{background:var(--card);border:1px solid var(--rule);margin-bottom:20px;padding:20px}
.panel h2{margin:0 0 5px;font-family:var(--cond);font-weight:700;font-size:19px;letter-spacing:-.01em}
.cap{font-family:var(--cond);font-weight:600;font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);line-height:1.35;margin:0 0 13px}
#bookcut{margin-bottom:2px;color:var(--ink-2)}
#bookcut:empty{display:none}
#quarter h2{margin-bottom:14px}

/* ── 이번 분기 요약 ──────────────────────────────────────── */
.tally{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--rule-2);margin-bottom:16px}
.tally div{flex:1 1 0;min-width:76px;padding:10px 12px;text-align:center}
.tally div+div{border-left:1px solid var(--rule-2)}
.tally .n{font-family:var(--mono);font-weight:500;font-size:23px;letter-spacing:-.02em;
  line-height:1.1;display:block;margin-bottom:3px}
.tally .k{font-family:var(--cond);font-weight:600;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);line-height:1.25}
.tally .up .n{color:var(--up)} .tally .down .n{color:var(--down)}

.says{margin:0 0 16px;font-family:var(--body);font-size:16.5px;line-height:1.6;color:var(--ink)}
.says p{margin:0 0 6px} .says p:last-child{margin-bottom:0}

/* 사건(신규·재진입·전량매도)은 크기가 아니라 사건이라 접히지 않고 늘 위에 있다 */
.events{border-top:1px solid var(--rule-2);padding-top:12px}
.ev{display:flex;align-items:baseline;gap:10px;font-family:var(--mono);font-size:12px;
  line-height:1.9;color:var(--ink-2);flex-wrap:wrap}
.ev .tag{font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;border:1px solid currentColor;padding:1px 5px;flex:0 0 auto}
.ev.in .tag{color:var(--up)} .ev.out .tag{color:var(--down)}
.ev .nm{color:var(--ink);flex:1 1 auto;min-width:0}
.ev .sub{color:var(--ink-3);flex:0 0 auto}

/* ── 접힘 ─────────────────────────────────────────────────
   **지우지 마세요.** 한 번 지웠다가 되살렸습니다 — 상위 10개만 남기고 나머지를
   통째로 없앤 것은 사용자가 뜻한 바가 아니었습니다("숨겨두기로 했는데 완전
   삭제했어"). 접어 두는 것과 없애는 것은 다릅니다. */
details.fold{border-top:1px solid var(--rule-2);margin-top:2px}
details.fold>summary{list-style:none;cursor:pointer;padding:11px 0 2px;
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  font-family:var(--cond);font-weight:700;font-size:13px;color:var(--ink-2)}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"\25B8";color:var(--ink-3);font-size:11px}
details.fold[open]>summary::before{content:"\25BE"}
details.fold>summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
details.fold>summary .why{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--ink-3)}
details.fold .rows{margin-top:4px}

/* ── 종목 줄 ─────────────────────────────────────────────── */
.rows{margin:0;padding:0;list-style:none}
.row{border-top:1px solid var(--rule-2)}
.row:first-child{border-top:0}
/* 줄을 누르면 그 종목의 일생이 펼쳐집니다. 여닫이는 `<details>` 가 쥐고 있고
   `<summary>` 가 줄 자체입니다 — **줄 여백(padding)이 `.row` 가 아니라 여기
   있어야 합니다.** `.row` 에 두면 펼친 차트 아래까지 여백이 붙고, 비중 막대의
   기준 상자(`position:relative`)도 차트 높이만큼 늘어나 줄이 기둥이 됩니다.
   기본 삼각형 표식은 지웁니다 — 우리 것은 `.caret` 입니다. */
.rowline{position:relative;display:block;padding:11px 0 12px;cursor:pointer;
  list-style:none;-webkit-tap-highlight-color:transparent}
.rowline::-webkit-details-marker{display:none}
.rowline::marker{content:""}
.rowline:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* 여닫이 표식. '더 보기' 와 같은 글자를 씁니다 — 이 화면에서 무언가 열린다는
   말은 하나면 됩니다. 머리글에도 같은 상자를 빈 채로 둬서 열이 안 어긋납니다. */
.caret{flex:0 0 auto;width:9px;font-size:9px;line-height:1;color:var(--ink-3);
  font-weight:400;text-align:center}
.lf>.rowline>.rowin>.who>.caret::before{content:"\25B8"}
.lf[open]>.rowline>.rowin>.who>.caret::before{content:"\25BE"}
/* 비중 막대는 줄의 바탕이다. 제일 큰 종목이 100% 폭이 되게 맞춰 그린다. */
.bar{position:absolute;left:0;top:0;bottom:0;background:rgba(15,26,36,.055);z-index:0}
/* 직전 분기 비중 자리. **줄 높이를 다 가로지르면 이름 글자를 뚫고 지나간다**
   (Kraft Heinz 의 '헤' 자리에 세로줄이 그어져 있었다). 그래서 줄 바닥에만
   짧게 찍는다 — 보유 연차 자와 같은 눈금 어휘라 새 기호를 배울 것이 없다. */
.tick{position:absolute;bottom:0;height:11px;width:0;border-left:1.2px solid var(--ink-3);opacity:.85;z-index:1}
/* 한 줄은 **세 덩어리**입니다 (2026-09-15, 사용자가 그려 준 구조).

     {왼쪽}  로고 · 순위 · 이름 · 섹터
     {가운데} 보유 주식 수 · 이번 분기 ±주식수 · 추정 수익률
     {오른쪽} 보유 금액, 줄 바꿔 작은 글씨로 비중

   **칸마다 최소 폭을 줍니다.** 줄(`<li>`)마다 격자가 따로라서, 폭을 안 주면
   칸이 줄마다 제 내용만큼 넓어져 세로줄이 안 맞습니다. 이 화면의 언어가
   계측기·측량 도면이라 거기서 다 무너집니다. 값은 실측으로 정했습니다. */
.rowin{position:relative;z-index:2;display:grid;
  grid-template-columns:minmax(0,1fr) auto auto;column-gap:18px;align-items:center}

/* ── 왼쪽: 누구인가 ──────────────────────────────────────── */
.who{display:flex;align-items:center;gap:9px;min-width:0;flex-wrap:wrap}
.rk{font-family:var(--mono);font-size:11px;color:var(--ink-3);
  min-width:16px;text-align:right;flex:0 0 auto}
.nm{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.01em;
  line-height:1.25;min-width:0;overflow-wrap:anywhere}
/* 회사 마크. **로고와 글자 타일이 똑같은 상자를 쓰는 것이 핵심**이다 —
   상자가 제각각이면 몇 줄만 그림이 있는 목록이 '덜 만든 화면'처럼 보인다.
   17px 로 만들었다가 키웠다: 그 크기에서는 심벌(사과·G)만 읽히고 글자 로고
   (무디스·처브·크래프트하인즈)는 뭉개진다. 30px 부터 글자 로고가 살아난다.
   둥근 모서리는 없다(재료표 5번 — 이 화면에 동그라미는 ⓘ 와 표시등뿐). */
.mk{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;background:var(--card);border:1px solid var(--rule-2);flex:0 0 auto}
.mk svg{width:19px;height:19px;display:block}
.mk.img img{width:100%;height:100%;object-fit:contain;display:block}
.mk.mono{background:var(--ink-2);border-color:var(--ink-2);color:#fff;
  font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:.02em;line-height:1}
.cls{font-family:var(--cond);font-weight:600;font-size:9.5px;letter-spacing:.1em;
  color:var(--ink-3);border:1px solid var(--rule);padding:0 4px;margin-left:6px;
  white-space:nowrap;vertical-align:2px}
/* 섹터. **테두리를 두르지 않습니다** — 테두리 상자는 주식 종류(A+C)의 것이고,
   한 줄에 똑같이 생긴 상자가 둘이면 무엇이 무엇인지 흐려집니다. 섹터는
   이름에 딸린 설명이라 글자만 작고 흐리게 둡니다. */
.sec{font-family:var(--cond);font-weight:600;font-size:10.5px;letter-spacing:.06em;
  color:var(--ink-3);white-space:nowrap;flex:0 0 auto}

/* ── 가운데: 얼마나 들고, 이번에 얼마나 움직였고, 얼마가 됐나 ─────
   셋 다 가운데 맞춤입니다. 색은 수익률에만 씁니다 — 사고판 것은 이득이
   아니라 행동이라 중립색입니다(재료표 13). */
.mid{display:flex;align-items:flex-start;gap:12px;justify-content:center}
/* 줄 높이를 세 칸에 똑같이 못박습니다 — `.act` 만 다른 값을 쓰면 글자 상자가
   달라져 숫자가 3px 어긋납니다(실측으로 잡았습니다). */
.mid>span{font-family:var(--mono);font-size:12px;white-space:nowrap;
  font-variant-numeric:tabular-nums;text-align:center;line-height:1.25}
/* **이름표 자리를 세 칸이 똑같이 비워 둡니다.** 이번 분기 칸만 두 줄이면
   그 칸의 숫자가 이웃보다 한 줄 내려앉아 가로줄이 어긋납니다(실제로 그랬습니다).
   높이는 `.act i` 와 같은 14px 로 못박아 둡니다. */
.hold::before,.ret::before,.note::before{content:"";display:block;height:14px}
.hold{color:var(--ink-2);min-width:74px}
/* 이번 분기 칸은 두 줄입니다 — 위 이름표(BUY/SELL), 아래 주식수.
   **안 움직인 줄에도 이름표 자리를 비워 둡니다**(`i` 가 늘 있습니다).
   그래야 사고판 줄만 두 줄이 되어 목록이 들쭉날쭉해지지 않습니다. */
.act{color:var(--ink-2);min-width:86px;display:inline-flex;
  flex-direction:column;align-items:center}
.act i{font-style:normal;font-family:var(--cond);font-weight:700;font-size:9.5px;
  letter-spacing:.12em;height:14px;line-height:14px;color:var(--ink-3)}
.act i .up{color:var(--up)} .act i .down{color:var(--down)}
.ret{font-weight:500;min-width:70px}
.ret.up{color:var(--up)} .ret.down{color:var(--down)}
.note{color:var(--ink-3);min-width:70px}
html:not([lang="ko"]) .hold{min-width:118px}
html:not([lang="ko"]) .act{min-width:124px}

/* ── 목록 머리글 ─────────────────────────────────────────────
   열 이름은 **안 변하는 말**이라 머리에 한 번만 적습니다. 줄마다 바뀌는
   `BUY`/`SELL` 만 줄 안에 둡니다 — 변하는 것은 줄에, 안 변하는 것은 머리에. */
.head{padding:0 0 8px;border-bottom:1px solid var(--rule);align-items:end}
.head .mid>span,.head .amt span{font-family:var(--cond);font-weight:600;
  font-size:10px;letter-spacing:.1em;color:var(--ink-3);white-space:nowrap;
  text-transform:uppercase;line-height:1.2}
.head .amt span{text-align:right}
.head .hold::before,.head .ret::before{content:none}

/* ── 오른쪽: 금액이 주인공, 비중은 그 밑에 작게 ──────────────────
   비중은 막대가 이미 그림으로 말하고 있으므로 숫자는 작게 적습니다. */
.amt{display:flex;flex-direction:column;align-items:flex-end;gap:1px;min-width:78px}
.val{font-family:var(--mono);font-weight:500;font-size:20px;letter-spacing:-.02em;
  line-height:1.15;white-space:nowrap}
.wt{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;
  font-variant-numeric:tabular-nums;line-height:1}

/* ── 한 종목의 일생 (줄을 펼치면 나옵니다) ───────────────────
   **위 칸 가격선 · 아래 칸 매매 막대, 가로축을 함께 씁니다.** 성적표가 이미
   쓰는 어휘입니다. 색은 매매에만 씁니다 — 가격선은 방향이 아니라 사실이라
   중립색(재료표 4번의 `보조 가격선 --ink-2 1.6px`)입니다.

   **분기당 폭이 고정이라 차트가 카드보다 넓을 수 있습니다.** 그래서 감싼
   상자만 옆으로 흐르게 두고(`overflow-x:auto`), 페이지 자체는 안 넘치게
   `min-width:0` 으로 격자에서 풀어 줍니다. */
.life{margin:2px 0 13px;padding:0}
/* 캡션 줄은 **두 칸**입니다 — 왼쪽은 안 변하는 설명, 오른쪽은 마우스를 올린
   자리의 값. 오른쪽 자리를 늘 비워 두므로 글자가 나타나도 줄이 안 밀립니다
   (`min-height` 로 못박습니다). */
.lifecap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 4px;min-height:13px}
.lifecap>span{min-width:0}
/* 읽어 주는 값은 숫자라 고정폭입니다. 대문자·자간을 풀어 캡션과 구별합니다. */
.liferead{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:0;
  text-transform:none;color:var(--ink-2);white-space:nowrap;flex:0 0 auto}
.liferead i{font-style:normal;font-family:var(--cond);font-weight:700;font-size:9.5px;
  letter-spacing:.12em}
.liferead i.up{color:var(--up)} .liferead i.down{color:var(--down)}
/* 좁은 화면에서는 두 칸이 한 줄에 안 섭니다. **설명을 감추지 않고** 줄을 바꿉니다 —
   손을 떼면 값이 사라지는데 그때 설명까지 없으면 캡션 자리가 통째로 빕니다. */
@media (max-width:640px){
  .lifecap{flex-wrap:wrap;row-gap:2px}
  .liferead{flex:1 0 100%}
}
/* 기간 버튼 줄. **한 줄로 두고 좁으면 옆으로 흐릅니다** — 4번의 "2줄은 디자인이
   너무 조잡해질 것 같다"가 여기도 그대로 걸립니다. */
.lifeseg{margin:0 0 7px;max-width:100%;overflow-x:auto;
  -webkit-overflow-scrolling:touch}
.lifeseg button{flex:0 0 auto}
.lifescroll{overflow-x:auto;overflow-y:hidden;min-width:0;
  -webkit-overflow-scrolling:touch}
.lifescroll svg{display:block}
.lifesum,.lifenote{font-family:var(--mono);font-size:11px;line-height:1.7;
  color:var(--ink-3);margin:5px 0 0}
.lifenote{margin:0 0 13px}
.pLine{fill:none;stroke:var(--ink-2);stroke-width:1.6;
  stroke-linejoin:round;stroke-linecap:round}
.pDot{fill:var(--ink-2)}
.pLab{font-family:var(--mono);font-size:10.5px;fill:var(--ink-2)}
/* 0 기준선. 재료표의 `0% 기준선 1.3px` 그대로입니다. */
.zero{stroke:var(--ink-3);stroke-width:1.3}
.bUp{fill:var(--up)}
.bDn{fill:var(--down)}
.bLab{font-family:var(--mono);font-size:10px;font-weight:500}
.bLab.up{fill:var(--up)}
.bLab.down{fill:var(--down)}
/* 십자선. 재료표의 눈금 어휘 그대로 — 가는 실선 하나와 점 하나입니다.

   **`hidden` 속성으로 감추지 않습니다.** SVG 안에서는 그게 안 먹혀서, 자리를
   안 정한 십자선이 `x=0` 에 그대로 그려졌습니다 — 모든 차트 왼쪽 위에 세로줄
   하나와 점 반쪽이 붙어 있었습니다. 속성만 보고 "숨었다"고 시험해서 못 잡았고,
   화면을 찍어 보고 나서야 나왔습니다. 지금은 **클래스로** 켜고 끕니다. */
.cross{display:none}
.cross.on{display:inline}
.cross .cx{stroke:var(--ink-3);stroke-width:1;opacity:.55}
.cross .cdot{fill:var(--ink)}
.ax{stroke:var(--rule);stroke-width:1}
/* **맞춤을 CSS 에 두지 않습니다** — CSS 가 SVG 속성을 이겨서 맨 왼쪽 연도의
   `text-anchor="start"` 가 먹히지 않습니다(7번의 `fill` 과 같은 자리). */
.axL{font-family:var(--mono);font-size:9.5px;fill:var(--ink-3)}

/* ── 범례·각주 ───────────────────────────────────────────── */
.legend{display:flex;align-items:center;gap:8px;margin:14px 0 0;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);line-height:1.8}
.legend i{display:inline-block;width:0;height:11px;border-left:1.2px solid var(--ink-3);flex:0 0 auto;margin:0 5px}

  /* 좁은 화면에서는 세 덩어리가 한 줄에 못 들어갑니다. **왼쪽은 그대로 두고
     가운데·오른쪽만 아래로 내립니다** — 로고와 이름이 먼저 읽히는 순서는

<script>
/* ══ 데이터 ═══════════════════════════════════════════════════════════
   화면은 자기 집 파일만 읽습니다. Actions 가 주 1회 SEC 에서 받아
   data/titans/berkshire.json 에 저장합니다(scripts/fetch_13f.py).
══════════════════════════════════════════════════════════════════════ */
let RAW=null, LOADED=false, FIRSTY="";

/* 같은 발행사의 여러 종류 주식을 한 줄로 묶는다.
   CUSIP 아홉 자리 중 **앞 여섯 자리가 발행사**다. 알파벳 A(02079K305)와
   C(02079K107)가 그래서 같은 묶음이 된다.
   **우선주는 묶지 않는다** — 표만 없는 보통주(알파벳 C)와 달리 배당·청산
   순위가 다른 별개의 증권이다. 28년치에 딱 하나 있다(Sealed Air PFD CVA). */
const ISPFD=/\bPFD\b|PREFERRED/;
const gkey=h=>h.cusip.slice(0,6)+(ISPFD.test((h.class||"").toUpperCase())?"|P":"");

function merge(q){
  const g=new Map();
  for(const h of q.holdings){
    const k=gkey(h);
    let a=g.get(k);
    if(!a){ a={key:k,name:h.name,value:0,shares:0,classes:[],n:0,cusip:h.cusip,top:0}; g.set(k,a); }
    a.value+=h.value; a.shares+=h.shares; a.n++;
    /* 대표 CUSIP 은 그 묶음에서 제일 큰 줄의 것. ISIN 을 만들려면 여섯 자리로는
       부족하고 아홉 자리가 다 있어야 한다. */
    if(h.value>a.top){ a.top=h.value; a.cusip=h.cusip; }
    a.classes.push(h.class||"");
    a.name=h.name;
  }
  return g;
}
/* 묶음에 붙일 꼬리표. 두 줄 이상일 때만 A+C 처럼 적는다 — 합쳤다는 사실을
   화면에 밝히지 않으면 공시와 대조하는 사람이 줄 수를 못 맞춘다. */
function classTag(a){
  if(a.n<2) return "";
  const s=[...new Set(a.classes.map(c=>{
    const m=String(c).toUpperCase().match(/(?:CL|CLASS|SER|SERIES)\s*([A-Z])\b/);
    return m?m[1]:null;
  }).filter(Boolean))].sort();
  return s.length>1?s.join("+"):"";
}

const num=n=>Number(n||0).toLocaleString(LOCALE);
const pct=n=>`${n.toFixed(1)}%`;
function money(v){
  const b=v/1e9;
  if(b>=100) return `$${b.toFixed(0)}B`;
  if(b>=1)   return `$${b.toFixed(1)}B`;
  const m=v/1e6;
  return m>=1?`$${m.toFixed(0)}M`:`$${(v/1e3).toFixed(0)}K`;
}
function shortShares(n){
  if(LANG==="ko"){
    if(n>=1e8) return `${(n/1e8).toFixed(n>=1e9?0:2)}억주`;
    if(n>=1e4) return `${Math.round(n/1e4).toLocaleString(LOCALE)}만주`;
    return `${num(n)}주`;
  }
  if(n>=1e9) return `${(n/1e9).toFixed(2)}B shares`;
  if(n>=1e6) return `${(n/1e6).toFixed(1)}M shares`;
  return `${num(n)} shares`;
}
function fdate(iso){
  if(LANG==="ko") return String(iso).replace(/-/g,".");
  try{ return new Intl.DateTimeFormat(LOCALE,{year:"numeric",month:"short",day:"numeric"})
        .format(new Date(iso+"T00:00:00Z")); }
  catch(e){ return String(iso); }
}
/* 종목 이름은 공시에 전부 대문자로 적혀 있다(APPLE INC). 그대로 두면
   화면이 소리지르는 것처럼 보이므로 낱말머리만 대문자로 내린다.
   두 글자 이하 낱말과 이미 섞여 있는 이름은 그대로 둔다. */
/* 진짜 약어만 대문자로 남긴다. Inc·Corp·Co 까지 대문자로 두면 "Apple INC" 가 된다. */
const KEEP=new Set(["IBM","HP","NVR","USA","US","UK","AT&T","PLC","LLC","NV","SA","AG","ADR","REIT","MTN"]);
const SMALL=new Set(["of","and","the","for","de","la"]);
function title(s){
  if(/[a-z]/.test(s)) return s;
  return s.split(/\s+/).map((w,i)=>{
    if(KEEP.has(w.replace(/[^A-Z&.]/g,""))) return w;
    const low=w.toLowerCase();
    return (i>0&&SMALL.has(low))?low:w.charAt(0)+low.slice(1);
  }).join(" ");
}

/* ══ 그리기 ══════════════════════════════════════════════════════════ */
function build(){
  const qs=RAW.quarters;
  const cur=qs[qs.length-1], prv=qs[qs.length-2];
  const C=merge(cur), P=prv?merge(prv):new Map();
  const tc=[...C.values()].reduce((s,a)=>s+a.value,0);
  const tp=[...P.values()].reduce((s,a)=>s+a.value,0);

  /* 연속 보유 시작 분기. 끊겼다가 다시 들어온 것은 다시 들어온 시점부터 센다 —
     "10년 보유"가 중간에 판 3년을 포함하면 거짓말이 된다. */
  const seen=qs.map(q=>new Set(q.holdings.map(gkey)));
  const startOf=k=>{
    let i=qs.length-1;
    while(i>0 && seen[i-1].has(k)) i--;
    return {period:qs[i].period, qtrs:qs.length-i};
  };
  const everBefore=k=>seen.slice(0,-1).some(s=>s.has(k));

  /* 평균단가는 첫 분기부터 되짚어야 나온다 — 111개 분기를 한 번만 묶어 둔다 */
  const snaps=qs.map(merge);
  QS=qs.map(q=>String(q.period));      // lifeOf 가 분기 이름을 붙일 때 씁니다
  SPLITS=[];                           // 각주용. lifeOf 가 아래 map 에서 채웁니다

  const list=[...C.values()].map(a=>{
    const p=P.get(a.key);
    const st=startOf(a.key);
    const dsh=(p&&p.shares>0)?(a.shares/p.shares-1):null;
    const cb=costBasis(snaps,a.key);
    return {
      ...a,
      w:a.value/tc*100,
      wPrev:p?p.value/tp*100:null,
      dsh,
      flat:dsh!==null&&Math.abs(dsh)<5e-4,
      isNew:!p,
      back:!p&&everBefore(a.key),
      start:st.period, years:st.qtrs/4,
      avgCost:cb.avg, nowPrice:cb.last,
      /* 첫 공시(1998-12-31)에 이미 들어 있던 종목은 사들이는 장면이 안 보인다.
         그 값을 평균단가라고 적으면 "1998년에 그 값에 샀다"는 거짓말이 된다. */
      preData:cb.first===0,
      freshIn:st.qtrs<=1,
      /* 이번 분기에 사고판 몫을 분기말 가격으로 환산한다. 비중 변화는 가격이
         섞여 있어 행동을 말해 주지 않는다 — 주식수 차이만 쓴다. */
      /* 가운데 칸에 '몇 주 늘었나'를 적으려면 비율이 아니라 **주식수 차이**가
         필요하다. 비율(dsh)은 판정에, 이 값(dn)은 화면 표기에 쓴다. */
      dn:p?(a.shares-p.shares):null,
      /* 펼쳤을 때 그릴 분기 시계열. 저장소 파일 하나로 만들어지므로 주 1회
         워크플로가 13F 를 갱신하면 차트도 저절로 따라옵니다. */
      life:lifeOf(snaps,a.key),
      netUSD:(p?(a.shares-p.shares):a.shares)*(a.shares>0?a.value/a.shares:0)
    };
  }).sort((x,y)=>y.value-x.value);

  /* 이번 분기에 통째로 사라진 묶음 */
  const out=prv?[...P.values()].filter(a=>!C.has(a.key)).map(a=>{
    let i=qs.length-2; const k=a.key;
    while(i>0 && seen[i-1].has(k)) i--;
    return {...a, years:(qs.length-1-i)/4};
  }).sort((x,y)=>y.value-x.value):[];

  /* 각주에 들어갈 두 목록. **둘 다 자료에서 뽑습니다** — 손으로 적어 두면
     분할이 한 번 더 일어나거나 코카콜라를 파는 날 조용히 거짓말이 됩니다
     (CLAUDE.md 9-3 의 "사람이 붙어야 하는 표는 결국 낡습니다"). */
  const splits=[];
  for(const r of list) for(const sp of SPLITS)
    if(sp.key===r.key) splits.push(`${title(r.name)} ${sp.f}:1(${String(sp.q).slice(0,4)})`);
  const preNames=list.filter(r=>r.preData).map(r=>title(r.name));

  return {cur,prv,list,out,tc,tp,splits,preNames};
}

function tallyOf(B){
  let nw=0,add=0,trim=0,hold=0;
  for(const r of B.list){
    if(r.isNew) nw++;
    else if(r.flat) hold++;
    else if(r.dsh>0) add++;
    else if(r.dsh<0) trim++;
    else hold++;
  }
  return {nw,add,trim,hold,out:B.out.length};
}

/* 해석 문장 — **행동만 적습니다.** 속마음("좋게 본다")도, 앞일("지금이 기회")도
   쓰지 않습니다. 13F 에는 "왜"가 없고 무엇을·얼마나만 있습니다. */
function says(B,T){
  const p=[];
  const buys=B.list.filter(r=>r.netUSD>0).sort((a,b)=>b.netUSD-a.netUSD);
  const sells=B.list.filter(r=>r.netUSD<0).sort((a,b)=>a.netUSD-b.netUSD);
  if(buys[0]) p.push(tx("bought",title(buys[0].name),money(buys[0].netUSD)));
  if(sells[0]) p.push(tx("sold",title(sells[0].name),money(-sells[0].netUSD)));
  /* 영어는 숫자만, 한국어는 "종목"을 붙여 센다 — 사전 쪽에서 단위를 정한다 */
  if(T.hold>0) p.push(LANG==="ko"
    ? tx("untouched",tx("positions",T.hold),tx("positions",B.list.length))
    : tx("untouched",T.hold,B.list.length));
  return p;
}

/* ══ 회사 마크 ═══════════════════════════════════════════════════════
   CUSIP 앞 여섯 자리(발행사)로 찾습니다. 화면이 묶는 단위와 같아서
   알파벳 A 와 C 가 한 마크를 씁니다.

   **저장소에 박아 둡니다. 바깥에서 받아오지 않습니다.** 로고를 남의 서버에서
   불러오면 그쪽이 문을 닫는 날 화면이 조용히 빈칸이 됩니다 — 이 프로젝트가
   이미 두 번 겪은 일입니다(CLAUDE.md 11번). 실제로 무료로 쓰던 Clearbit
   로고 API 가 2025년 말에 닫혔습니다. 방문자 IP 가 새는 것도 막힙니다.

   출처: simple-icons (CC0-1.0). 도형 자체는 퍼블릭 도메인이고, 상표는 각
   회사 것입니다 — 여기서는 "무엇을 들고 있나"를 가리키는 용도로만 씁니다.

   **없는 회사가 더 많습니다.** 개발자용 브랜드 세트라 보험·에너지·산업재는
   거의 안 들어 있습니다(상위 10종목 중 다섯: 셰브런·옥시덴탈·처브·무디스·
   크래프트하인즈). 없으면 이름 첫 글자 타일로 대신합니다 — 빈칸을 두면
   그림을 못 불러온 것처럼 보입니다.

   추가하려면 한 줄 더 넣으면 됩니다: "CUSIP6":{h:"색", t:"이름", d:"path"}
══════════════════════════════════════════════════════════════════ */
/* ── ISIN 은 CUSIP 에서 만듭니다 ──────────────────────────────────
   미국 종목의 ISIN = "US" + CUSIP 아홉 자리 + 체크숫자 한 자리.
   체크숫자는 글자를 A=10 … Z=35 로 편 뒤 Luhn 으로 냅니다.
   문서 예시와 대조해 확인했습니다 — 594918104 → US5949181045,
   166764100 → US1667641005(문서의 뉴스 응답에 Chevron Corp. 으로 나옵니다).

   **첫 글자가 숫자가 아니면 미국 발행사가 아닙니다**(CINS). 처브가 그렇습니다
   (H1467J104 — 스위스). 그런 종목은 ISIN 을 지어낼 수 없으니 티커로 찾습니다. */
function isinCheck(body){
  let s="";
  for(const c of body.toUpperCase())
    s += /[0-9]/.test(c) ? c : String(c.charCodeAt(0)-55);
  let sum=0;
  for(let i=s.length-1;i>=0;i--){
    let d=+s[i];
    if((s.length-1-i)%2===0){ d*=2; if(d>9) d-=9; }
    sum+=d;
  }
  return (10-(sum%10))%10;
}
function usISIN(cusip){
  const c=String(cusip||"").toUpperCase();
  if(c.length!==9||!/^[0-9]/.test(c)) return null;   // CINS = 미국 발행사가 아님
  return "US"+c+isinCheck("US"+c);
}
/* ISIN 을 못 만드는 종목의 티커. **손으로 적지 않습니다.**
   `scripts/fetch_tickers.py` 가 주 1회 OpenFIGI 에서 받아
   `data/titans/tickers.json` 에 저장한 것을 그대로 읽습니다.
   못 받았거나 파일이 없으면 비어 있고, 마크는 글자 타일로 떨어집니다. */
let QS=[];
/* 각주에 적는 액면분할 목록입니다. **손으로 적어 두면 다음 분할 때 낡습니다** —
   코드가 이미 찾아내고 있으므로 찾은 것을 그대로 적습니다(`lifeOf` 가 채웁니다). */
let SPLITS=[];
/* 마우스를 올렸을 때 읽어 줄 좌표. 차트마다 한 칸이고 `<figure data-life>` 가
   그 첨자를 들고 있습니다. **SVG 속성에 넣지 않습니다** — 111분기짜리가 스물몇

/* 마크가 없을 때 쓰는 글자.
   **회사 형태를 뜻하는 낱말을 먼저 버립니다.** 안 버리면 Chevron Corporation 이
   'CC', Chubb Limited 가 'CL' 이 되어 회사가 아니라 법인 형태를 가리킵니다. */
const SUFFIX=/^(INC|INCORPORATED|CORP|CORPORATION|CO|COMPANY|LTD|LIMITED|PLC|LLC|LP|NV|SA|AG|HOLDINGS|HLDGS|GROUP|GRP|NEW|DEL|THE)$/i;
function monogram(name){
  const w=String(name).replace(/[^A-Za-z ]/g," ").trim().split(/\s+/)
    .filter(x=>x.length>1&&!SUFFIX.test(x));
  if(!w.length) return String(name).replace(/[^A-Za-z]/g,"").slice(0,2).toUpperCase()||"?";
  return (w.length>1?w[0][0]+w[1][0]:w[0].slice(0,2)).toUpperCase();
}
/* 뒤로 물러나는 순서: 바깥 그림 → 저장소의 simple-icons → 글자 타일.
   그래서 바깥 서버가 죽어도 화면은 이 기능을 켜기 전 모습 그대로가 된다. */
function localMark(r){
  const g=LOGO[r.key.split("|")[0]];
  if(g) return `<span class="mk"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"`
    +` style="fill:#${g.h}"><path d="${g.d}"/></svg></span>`;
  return `<span class="mk mono" aria-hidden="true">${monogram(r.name)}</span>`;
}
function markHTML(r){
  const url=(window.MARKS&&window.MARKS.url)||"";
  const fall=localMark(r);
  if(url){
    /* 미국 종목이면 ISIN 을 즉석에서 계산하고(표가 필요 없다),
       아니면 표에서 티커를 찾는다. 둘 다 없으면 바깥에 묻지 않는다. */
    const isin=usISIN(r.cusip), tk=TICKERS[r.cusip];
    const src = isin ? url.replace("{idType}","isin").replace("{id}",isin)
              : tk   ? url.replace("{idType}","symbol").replace("{id}",encodeURIComponent(tk))
              : null;
    if(src){
      return `<span class="mk img" aria-hidden="true"><img src="${src}" alt="" loading="lazy"`
        +` onerror="this.parentNode.outerHTML='${fall.replace(/'/g,"&#39;").replace(/"/g,"&quot;")}'"></span>`;
    }
  }
  return fall;
}

/* ══ 추정 매수 평균가 ═══════════════════════════════════════════════
   13F 에는 체결가가 없습니다. 있는 것은 분기말의 **금액과 주식수**뿐이고,
   나누면 그 분기말 가격이 나옵니다. 그래서 이렇게 어림합니다.

     분기마다 늘어난 주식수를  (직전 분기말 + 이번 분기말) / 2  로 사들였다고 보고
     이동평균으로 이어 붙입니다. 팔면 평균단가는 그대로 두고 원가만 비례해서 줄입니다.

   **추정입니다.** 실제로는 분기 중 아무 날에나 샀으므로 크게 빗나갈 수 있습니다.
   각주에 그렇게 적어 두었고, 화면에도 '추정'이라고 씁니다.

   ── 액면분할이 제일 큰 함정입니다 ──────────────────────────────
   2020년 8월 애플 4:1 때 주식수가 245M → 944M 으로 뜁니다. 이걸 '샀다'로 세면
   **추정 평균단가가 $39.59 대신 $213.33 이 되어 수익률이 +631% 대신 +36% 로
   나옵니다.** 실측으로 확인한 숫자입니다 — 분할을 안 잡으면 이 화면은 거짓말을 합니다.

   분할은 공시 자체에서 찾습니다: 주식수가 f 배로 뛰면서 가격이 꼭 1/f 로 내려간 분기.
   **정수 배수만 인정합니다.** 1.5 배를 후보에 넣었더니 '55% 더 산 분기'(애플 2016-06)와
   '주식을 크게 늘린 분기'(레너드 2026-03)가 분할로 잡혔습니다. 정수만 두면
   현재 26묶음에서 다섯 건이 정확히 잡히고 오탐이 없습니다 —
   애플 ×4(2020-09) · 아멕스 ×3(2000-06) · 코카콜라 ×2(2012-09) ·
   무디스 ×2(2005-06) · 다비타 ×2(2013-09).
══════════════════════════════════════════════════════════════════ */
const SPLITF=[2,3,4,5,6,7,8,10,15,20];
/* 가격 쪽 여유가 넉넉한 것은 분기 중에 시세가 움직이기 때문입니다 —
   애플은 분할과 같은 분기에 주가가 27% 올랐습니다. */
function splitFactor(rShares,rPrice){
  let best=null;
  for(const f of SPLITF){
    if(Math.abs(rShares/f-1)<.30 && Math.abs(rPrice/f-1)<.30){
      if(best===null||Math.abs(rShares/f-1)<Math.abs(rShares/best-1)) best=f;
    }
  }
  return best;
}
/* 묶음 하나의 일생을 처음부터 되짚어 평균단가를 만든다.
   전량 매도하면 0 에서 다시 시작한다 — 3년 전에 팔고 다시 산 종목의
   평균단가에 옛 매수가 섞이면 안 된다. */
function costBasis(snaps,key){
  let held=0,cost=0,prevP=null,first=null;
  for(let i=0;i<snaps.length;i++){
    const a=snaps[i].get(key);
    if(!a||a.shares<=0||a.value<=0){ held=0;cost=0;prevP=null;first=null; continue; }
    const p=a.value/a.shares;
    if(first===null) first=i;
    if(held>0&&prevP){
      const f=splitFactor(a.shares/held, prevP/p);
      if(f) held*=f;
    }
    if(held===0){ cost=a.shares*p; held=a.shares; }
    else if(a.shares>held){ cost+=(a.shares-held)*((prevP+p)/2); held=a.shares; }
    else if(a.shares<held){ cost*=a.shares/held; held=a.shares; }
    prevP=p;
  }
  return {avg:held>0?cost/held:null, first, last:prevP};
}

/* 한 묶음의 **일생** — 분기말 가격과 그 분기에 사고판 주식수.

   **새 자료가 한 톨도 필요 없습니다.** 13F 의 `금액 ÷ 주식수` 가 곧 그 분기말
   가격이고, 분할만 보정하면 진짜 주가 이력이 됩니다. 실측으로 대조했습니다 —
   애플 2023-12-31 이 $192.53 로 실제 종가와 같고, 2016-03-31 은 $27.25 로
   실제 $108.99 를 2020년 4:1 분할로 나눈 값과 같습니다.

   **과거를 오늘 기준으로 맞춥니다** — 분할이 나오면 그때까지 쌓은 값의 가격은
   ÷f, 주식수는 ×f. 안 그러면 분할이 '699M주 매수'로 찍혀 거짓말이 됩니다.

   **전량 매도하면 끊습니다.** 3년 전에 팔고 다시 산 종목의 선을 이어 그리면
   중간에 없었던 사실이 사라집니다(보유 연차를 세는 규칙과 같은 자리). */
function lifeOf(snaps,key){
  const out=[];
  let held=null,prevP=null;
  for(let i=0;i<snaps.length;i++){
    const a=snaps[i].get(key);
    if(!a||a.shares<=0||a.value<=0){ held=null;prevP=null;continue; }
    const p=a.value/a.shares;
    if(held&&prevP){
      const f=splitFactor(a.shares/held, prevP/p);
      /* **직전 주식수도 같이 늘려야 합니다.** 지난 분기들만 고치고 `held` 를 그대로
         두면 이번 분기 증감이 `944M - 245M = +699M` 으로 잡혀 **액면분할이 사상
         최대의 매수로 그려집니다**(애플 2020-09 에서 실제로 그랬습니다).
         늘려 두면 `944M - 980M = -36M` 으로, 그 분기에 실제로 판 만큼만 남습니다. */
      if(f){ for(const o of out){ o.p/=f; o.sh*=f; o.dn*=f; } held*=f; SPLITS.push({key,q:QS[i],f}); }
    }
    /* **`gi` 는 전체 분기 목록에서의 자리입니다.** 배열 첨자로 가로 위치를
       잡으면 안 됩니다 — 뱅크오브아메리카는 2010-09 에 전량 매도하고 2017-09
       에 다시 샀는데, 첨자로 그리면 두 점이 **바로 옆에 붙어 7년이 통째로
       사라집니다**(실제로 그렇게 그려지고 있었습니다). */
    out.push({q:QS[i], gi:i, p, sh:a.shares, dn:held?a.shares-held:0, first:!held});
    held=a.shares; prevP=p;
  }
  return out;
}

/* 주당 가격. 금액(money)과 자릿수가 다르다 — $66.0B 와 $289.36 은 다른 자입니다. */
const usd=n=>"$"+n.toLocaleString(LOCALE,{minimumFractionDigits:2,maximumFractionDigits:2});

/* 수익률은 자릿수가 커진다. 100% 안쪽은 소수 한 자리, 그 밖은 정수. */
function retPct(r){
  const v=r*100, a=Math.abs(v);
  const n=a<100?v.toFixed(1):Math.round(v).toLocaleString(LOCALE);
  return (v>0?"+":v<0?"\u2212":"")+String(n).replace("-","")+"%";
}

/* ── 한 종목의 일생 ───────────────────────────────────────────────
   **위 칸 가격 · 아래 칸 매매, 가로축을 함께 씁니다.** 성적표에서 이미 쓰는
   어휘입니다("위 칸 수익률 중앙값 / 아래 칸 수익날 확률") — 새로 배울 것이 없습니다.

   **가로축은 배열 첨자가 아니라 실제 시간입니다**(`gi` = 전체 분기 목록에서의
   자리). 첨자로 그리면 중간에 안 들고 있던 기간이 통째로 접혀서, 뱅크오브아메리카의
   2010-09 와 2017-09 가 바로 옆에 붙고 **7년이 사라진 채 선이 이어집니다**.
   지금은 빈 자리가 빈 자리로 남고 **선도 거기서 끊깁니다**(`first` 에서 `M`).

   **분기당 폭은 12px 이 기본입니다**(`PXQ`) — 900px 카드에 약 15년치(60분기)가
   들어가고 그 이전은 옆으로 끕니다. 다만 **이력이 짧으면 그만큼 늘립니다**
   (최대 4배). 알파벳(4분기)이 122px 짜리 우표만 하게 그려지고 있었습니다.
   늘려도 배율이 달라지는 것뿐이고, 몇 분기인지는 아래 한 줄이 늘 적습니다.

   **색은 매매에만 씁니다.** 가격선은 방향이 아니라 사실이라 중립색입니다
   (재료표 4번의 `보조 가격선 --ink-2 1.6px`). 매수·매도만 `--up`/`--down` 이라
   언어를 따라 뒤집힙니다.

   **호버를 안 만들었습니다.** 손가락에는 호버가 없어서, 값을 읽히려면 그림 위에
   적어야 합니다(재료표 "숫자는 그림뿐 아니라 값으로도"). 그래서 가장 큰 매수와
   가장 큰 매도에만 이름표를 달고, 나머지 숫자는 아래 한 줄에 적습니다. */
const PXQ=12, LEFT=10, RIGHT=76, PADT=16, H1=96, GAP=12, H2=40, PADB=30;

/* 그림만 그립니다(버튼·캡션은 `chartHTML` 이 두릅니다). 기간 버튼을 누르면
   줄을 통째로 다시 그리지 않고 **이 결과만 갈아 끼웁니다** — 다시 그리면 펼쳐
   놓은 줄이 접히고 방금 누른 버튼이 사라져 초점을 잃습니다(7번의 "버튼은 한 번만
   만들고 이후엔 aria-pressed 만 옮깁니다"와 같은 자리). */
function chartBody(r, li){
  const ALL=r.life||[];

  /* **기간 버튼이 고른 만큼만 봅니다.** 자르는 쪽은 늘 과거입니다 — 가장 최근
     분기는 어느 기간에서도 보여야 합니다. 잘라서 점이 하나만 남으면 선이 안
     그려지므로 둘이 될 때까지 되물립니다(이번 분기에 들어온 종목에서 실제로
     일어납니다). */
  const want=effRange(r);
  let L=ALL;
  if(want){
    const cut=ALL[ALL.length-1].gi-want+1;
    let s=ALL.findIndex(o=>o.gi>=cut);
    if(s<0) s=ALL.length-1;
    if(s>ALL.length-2) s=ALL.length-2;
    L=ALL.slice(s);
  }

  /* 그 분기에 실제로 사고판 주식수. **묶음이 새로 시작하는 분기는 전량 매수**이고,
     다만 맨 첫 분기가 집계 시작(1998)이면 사들이는 장면을 못 봤으므로 0 으로 둡니다 —
     거기에 막대를 세우면 "1998년에 4억주를 샀다"는 거짓말이 됩니다. */
  const mv=L.map(o=>o.first?((o===ALL[0]&&r.preData)?0:o.sh):o.dn);

  /* **한 번도 안 사고판 종목은 아래 칸을 아예 안 그립니다.** 코카콜라는 111분기
     내내 막대가 0 인데, 빈 칸에 0선만 그으면 "고장난 화면"으로 읽힙니다.
     칸을 지우고 그 사실을 아래 한 줄에 말로 적습니다. */
  const traded=mv.some(v=>v);
  const G=traded?GAP:0, B2=traded?H2:0;

  /* 가로 자리는 **처음 산 분기부터 몇 분기 뒤인가**로 잡습니다. 안 들고 있던
     분기도 자리를 차지해야 시간이 사라지지 않습니다. */
  const g0=L[0].gi, span=L[L.length-1].gi-g0;
  /* 짧은 이력은 늘려 줍니다 — 60분기(15년) 어치 폭 안에서만. */
  const PX=span>0?Math.min(PXQ*8, Math.max(PXQ, PXQ*60/span)):PXQ;
  const n=L.length, W=LEFT+span*PX+RIGHT, H=PADT+H1+G+B2+PADB;
  const ps=L.map(o=>o.p);
  let lo=Math.min(...ps), hi=Math.max(...ps);
  const pad=(hi-lo)*.06||hi*.06||1; lo-=pad; hi+=pad;
  const x=i=>LEFT+(L[i].gi-g0)*PX;   // i 는 L 의 첨자, 자리는 gi 가 정한다
  const xg=g=>LEFT+(g-g0)*PX;        // 전체 분기 목록의 자리로 바로 잡을 때
  const y=v=>PADT+H1-(v-lo)/(hi-lo)*H1;
  const zero=PADT+H1+G+B2/2;
  const mx=Math.max(...mv.map(Math.abs))||1;
  const bw=Math.max(3,Math.min(PX-4,26));

  /* **전량 매도했다가 다시 산 자리에서는 선을 끊습니다**(`o.first`). 이어 그리면
     그동안 안 들고 있었다는 사실이 사라집니다 — 보유 연차를 셀 때와 같은 규칙입니다. */
  const line=L.map((o,i)=>`${(i&&!o.first)?"L":"M"}${x(i).toFixed(1)} ${y(o.p).toFixed(1)}`).join(" ");

  /* 막대. 매수는 0선 위로, 매도는 아래로. 0선은 재료표의 `0% 기준선 1.3px`. */
  const bars=!traded?"":mv.map((v,i)=>{
    if(!v) return "";
    const h=Math.max(1.5,Math.abs(v)/mx*(H2/2-2));
    return `<rect x="${(x(i)-bw/2).toFixed(1)}" y="${(v>0?zero-h:zero).toFixed(1)}"
      width="${bw}" height="${h.toFixed(1)}" class="${v>0?"bUp":"bDn"}"/>`;
  }).join("");

  /* 가장 큰 매수 하나와 가장 큰 매도 하나에만 이름표. 스물몇 개를 다 적으면
     14px 간격에서 글자가 겹쳐 뭉갭니다(재료표의 "띠가 좁으면 이름 생략"과 같은 처리). */
  let bi=-1,si=-1;
  if(traded) mv.forEach((v,i)=>{ if(v>0&&(bi<0||v>mv[bi]))bi=i; if(v<0&&(si<0||v<mv[si]))si=i; });
  const marks=[[bi,"up",-6],[si,"down",13]].filter(([i])=>i>=0).map(([i,c,dy])=>{
    const h=Math.abs(mv[i])/mx*(H2/2-2);
    const yy=mv[i]>0?zero-h+dy:zero+h+dy;
    const anc=x(i)<70?"start":x(i)>W-RIGHT-30?"end":"middle";
    return `<text x="${x(i).toFixed(1)}" y="${yy.toFixed(1)}" text-anchor="${anc}"
      class="bLab ${c}">${(mv[i]>0?"+":"\u2212")+shortShares(Math.abs(mv[i]))}</text>`;
  }).join("");

  /* 연도 눈금. **몇 년마다 찍을지는 픽셀을 재서 정합니다** — `%2` 로 박아 두면
     늘어난 차트에서는 너무 성기고, 기본 폭에서는 `2007 2008` 처럼 글자가 붙습니다
     (실제로 붙어 있었습니다). 한 해 간격이 `4*PX` 이므로 60px 을 넘도록 잡습니다.
     그러고도 **바로 앞 이름표와 겹치면 건너뜁니다** — 맨 왼쪽 눈금은 늘 찍히는데,
     그 다음 눈금이 한두 분기 뒤일 수 있습니다. */
  const step=Math.max(1,Math.ceil(60/(4*PX)));
  const cand=[];
  let prevY=null;
  for(let g=g0; g<=L[L.length-1].gi; g++){
    const yr=+String(QS[g]).slice(0,4);
    if(yr===prevY) continue;
    prevY=yr;
    if(g>g0 && yr%step!==0) continue;
    /* 맨 왼쪽 연도는 가운데 맞춤으로 두면 그림 밖으로 반쯤 잘려 나갑니다. */
    const gx=xg(g), anc=gx<20?"start":"middle";
    cand.push({gx, yr, anc, stub:g===g0});
  }

  /* **글자 상자의 가장자리로 겹침을 봅니다.** 가운뎃점 사이 거리로 재면
     맨 왼쪽(`start` 맞춤) 이름표가 오른쪽으로만 뻗는 것을 놓쳐서 `2007 2008` 이
     3px 겹쳐 있었습니다. 9.5px 고정폭 네 글자는 약 24px 입니다.

     **겹치면 첫 눈금(`stub`)을 버리고 제자리 연도를 남깁니다.** 첫 눈금은 1월이
     아니라 *처음 산 분기*에 서 있어서, 그것 때문에 다음 연도를 버리면 축이
     `2020 2022 2023…` 처럼 들쭉날쭉해집니다. 선이 어디서 시작하는지는 그림이
     이미 말하고 있으므로, 규칙적인 연도 쪽을 남기는 편이 자로 읽힙니다. */
  const LW=24, keep=[];
  const right=c=>c.gx+(c.anc==="start"?LW:LW/2);
  const left =c=>c.gx-(c.anc==="start"?0:LW/2);
  for(const c of cand){
    const prev=keep[keep.length-1];
    if(prev && left(c)-right(prev)<8){ if(prev.stub) keep[keep.length-1]=c; continue; }
    keep.push(c);
  }

  let ticks="";
  for(const c of keep)
    ticks+=`<line x1="${c.gx.toFixed(1)}" y1="${PADT+H1+G+B2}" x2="${c.gx.toFixed(1)}" y2="${PADT+H1+G+B2+4}" class="ax"/>`
         +`<text x="${c.gx.toFixed(1)}" y="${H-5}" text-anchor="${c.anc}" class="axL">${c.yr}</text>`;

  const last=L[L.length-1];

  /* 마우스를 올리면 그 분기의 값을 읽어 줍니다. 좌표를 여기서 한 번 계산해 두면
     움직일 때마다 가장 가까운 점을 고르기만 하면 됩니다.
     **`li` 는 매개변수입니다** — 여기서 다시 선언하면 `Identifier 'li' has already
     been declared` 로 화면이 통째로 빕니다(`tag`/`flag` 때와 같은 자리). */
  LIFES[li]={r, pts:L.map((o,i)=>({x:x(i), y:y(o.p), q:o.q, p:o.p, mv:mv[i]})),
             top:PADT, bot:PADT+H1+G+B2};

  const svg=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img"
           aria-label="${title(r.name)}">
        <g class="cross">
          <line class="cx" y1="${PADT}" y2="${PADT+H1+G+B2}"/>
          <circle class="cdot" r="3.2"/>
        </g>
        <path d="${line}" class="pLine"/>
        <circle cx="${x(n-1)}" cy="${y(last.p).toFixed(1)}" r="2.6" class="pDot"/>
        <text x="${(x(n-1)+7).toFixed(1)}" y="${(y(last.p)+4).toFixed(1)}"
              class="pLab">${usd(last.p)}</text>
        ${traded?`<line x1="${LEFT-4}" y1="${zero}" x2="${W-RIGHT+4}" y2="${zero}" class="zero"/>`:""}
        ${bars}${marks}${ticks}
      </svg>`;

  const sum=`${tx("lifeSum",n,usd(Math.min(...ps)),usd(Math.max(...ps)))}${
    traded?"":" \u00B7 "+tx("lifeQuiet")}<span
    class="hint" hidden> · ${tx("lifeScroll")}</span>`;

  return {svg, sum, cap:traded?tx("lifeCap"):tx("lifeCapP")};
}

/* 기간 버튼 — `1년 3년 5년 10년 15년 전체` (사용자 요청).
   값은 **분기 수**입니다. 0 은 전체입니다. */
const LR=[4,12,20,40,60,0];
let LRANGE=0;                      // 지금 고른 기간. 모든 줄이 함께 씁니다.

/* **한 줄만 따로 놀게 하지 않습니다.** 기간은 그 종목의 성질이 아니라 *보는 방법*
   이라 26줄이 제각각이면 위아래를 견줄 수 없습니다. 4번 대시보드에서 위·아래
   버튼을 묶어 둔 것과 같은 판단입니다. */
function loadRange(){
  try{ const v=+localStorage.getItem("bk.range");
       if(LR.includes(v)) LRANGE=v; }catch(e){}
}
function saveRange(){ try{ localStorage.setItem("bk.range",LRANGE) }catch(e){} }

/* 그 종목이 실제로 갖고 있는 분기 수(빈 자리 포함). */
const lifeSpan=r=>{ const L=r.life||[]; return L.length?L[L.length-1].gi-L[0].gi+1:0; };

/* **이력보다 긴 기간은 누를 수 없게 합니다.** 15년 버튼이 눌린 4분기짜리 종목은
   전체와 똑같은 그림을 그리면서 이름표만 거짓말을 합니다. 그런 줄에서는 전체로
   떨어집니다 — 값을 고쳐 놓지는 않으므로, 이력이 긴 줄은 고른 기간 그대로입니다. */
const okRange=(r,q)=>!q||q<lifeSpan(r);
const effRange=r=>okRange(r,LRANGE)?LRANGE:0;

function rangeBar(r){
  const now=effRange(r);
  return `<div class="seg mini lifeseg" role="group" aria-label="${tx("lifeSpanLab")}">`
    + LR.map((q,i)=>`<button type="button" data-q="${q}"`
        + `${okRange(r,q)?"":" disabled"}`
        + ` aria-pressed="${q===now}">${tx("lifeSpans")[i]}</button>`).join("")
    + `</div>`;
}

function chartHTML(r){
  const L=r.life||[];
  if(L.length<2) return `<p class="lifenote">${tx("lifeThin")}</p>`;
  const li=LIFES.length; LIFES.push(null);      // 자리를 먼저 잡고 chartBody 가 채웁니다
  const o=chartBody(r,li);
  return `<figure class="life" data-life="${li}">
    <figcaption class="lifecap"><span class="lifewhat">${o.cap}</span><b
      class="liferead" aria-live="polite"></b></figcaption>
    ${rangeBar(r)}
    <div class="lifescroll">${o.svg}</div>
    <p class="lifesum">${o.sum}</p>
  </figure>`;
}

/* 기간을 바꾸면 **그림과 아래 한 줄만** 갈아 끼웁니다. 줄 전체를 다시 그리면
   펼쳐 둔 것이 접힙니다. */
function drawLife(fig){
  const li=+fig.dataset.life, st=LIFES[li];
  if(!st) return;
  const r=st.r, o=chartBody(r,li);
  fig.querySelector(".lifescroll").innerHTML=o.svg;
  fig.querySelector(".lifesum").innerHTML=o.sum;
  fig.querySelector(".lifewhat").textContent=o.cap;
  clearLife(fig);
  const now=effRange(r);
  fig.querySelectorAll(".lifeseg button").forEach(b=>
    b.setAttribute("aria-pressed", String(+b.dataset.q===now)));
  settleLife(fig);
}


function rowHTML(r,rank,maxW){
  const tag=classTag(r), sec=sectorOf(r);
  const barW=Math.max(0,Math.min(100,r.w/maxW*100));
  const tickW=r.wPrev===null?null:Math.max(0,Math.min(100,r.wPrev/maxW*100));

  /* 가운데 둘째 칸 — 이번 분기에 **몇 주** 사고팔았나. 두 줄입니다:
     위에 `BUY`/`SELL`, 아래에 주식수(사용자 요청).

     **색은 이름표에만 씁니다.** 숫자까지 칠하면 한 줄에 빨간 숫자가 둘이 되어
     (증감과 수익률) 어느 쪽이 돈 이야기인지 흐려집니다. `--up`/`--down` 을
     쓰므로 언어를 따라 함께 뒤집힙니다 — 한국어는 빨강 매수/파랑 매도,
     영어는 초록 매수/빨강 매도(6번의 색 규칙).

     **안 움직인 줄에도 이름표 자리를 비워 둡니다.** 안 그러면 사고판 줄만
     두 줄이 되어 목록이 들쭉날쭉해집니다. */
  /* 이름이 `tag` 가 아니라 `flag` 인 이유: 위에서 `tag` 는 이미 주식 종류
     꼬리표(A+C)로 쓰고 있습니다. 겹쳐 쓰면 화면이 통째로 빕니다 — 실제로
     한 번 그랬습니다(`Identifier 'tag' has already been declared`). */
  let flag="", num;
  if(r.flat||!r.dn){ num=tx("same"); }
  else{
    const up=r.isNew||r.dn>0;
    flag=`<b class="${up?"up":"down"}">${up?tx("buy"):tx("sell")}</b>`;
    num=(up?"+":"\u2212")+shortShares(Math.abs(r.isNew?r.shares:r.dn));
  }
  const act=`<span class="act"><i>${flag}</i>${num}</span>`;

  /* 가운데 셋째 칸 — 추정 수익률. 못 쓰는 자리가 둘 있고, 둘 다 말로 밝힙니다.
     칸이 좁으므로 여기서는 짧게 적고 긴 설명은 각주가 합니다. */
  let gain;
  if(r.preData) gain=`<span class="note">${tx("noRetOld")}</span>`;
  else if(r.freshIn||!r.avgCost) gain=`<span class="note">${tx("noRetNew")}</span>`;
  else{
    const g=r.nowPrice/r.avgCost-1;
    gain=`<span class="ret ${g>=0?"up":"down"}">${retPct(g)}</span>`;
  }

  /* 줄을 누르면 그 종목의 일생이 펼쳐집니다. `<details>` 를 쓰므로 키보드와
     여닫이가 공짜로 따라옵니다 — 아래 '더 보기' 와 같은 어휘입니다.
     **비중 막대와 직전 분기 표식은 `<summary>` 안**에 둡니다. `<li>` 에 두면
     펼친 차트 높이까지 막대가 늘어나 줄이 아니라 기둥처럼 보입니다. */
  return `<li class="row"><details class="lf">
    <summary class="rowline">
    <span class="bar" style="width:${barW.toFixed(2)}%"></span>
    ${tickW===null?"":`<span class="tick" style="left:${tickW.toFixed(2)}%"></span>`}
    <div class="rowin">
      <div class="who">
        <b class="caret"></b>
        ${markHTML(r)}
        <span class="rk">${rank}</span>
        <span class="nm">${title(r.name)}${tag?`<span class="cls">${tag}</span>`:""}</span>
        ${sec?`<span class="sec">${sec}</span>`:""}
      </div>
      <div class="mid">
        <span class="hold">${shortShares(r.shares)}</span>
        ${act}
        ${gain}
      </div>
      <div class="amt">
        <span class="val">${money(r.value)}</span>
        <span class="wt">${pct(r.w)}</span>
      </div>
    </div>
    </summary>
    ${chartHTML(r)}
  </details></li>`;
}

/* 차트는 **오른쪽 끝(가장 최근 분기)에서 시작합니다.** 28년치는 카드보다
   넓어서 왼쪽 끝에서 열리면 1998년이 먼저 보이는데, 사람이 궁금한 것은
   지금입니다. 접혀 있는 동안은 폭이 0 이라 미리 옮겨 둘 수 없으므로
   여는 순간에 옮깁니다(`toggle` 은 버블링하지 않아 줄마다 답니다). */
/* 마우스를 올린 자리의 값을 읽어 줍니다 (사용자 요청).

   **그림 위에 글자를 띄우지 않습니다.** 말풍선은 선과 막대를 가리고, 좁은 화면에서는
   그림 밖으로 나갑니다. 대신 **캡션 줄 오른쪽**에 고정된 자리를 두고 거기를 채웁니다 —
   자리가 늘 비어 있으므로 글자가 나타나도 줄이 안 밀립니다.

   **손가락에도 돕니다.** `pointer` 이벤트라 터치로 끌어도 값이 따라 움직이고,
   손을 떼면 지워집니다(`pointerup`). 7번의 "hover 는 마우스일 때만"은 ⓘ 툴팁처럼
   **여닫이가 있는 것**의 이야기이고, 여기는 읽기만 하므로 경합할 상대가 없습니다. */
function readLife(fig, clientX){
  const L=LIFES[+fig.dataset.life]; if(!L) return;
  const svg=fig.querySelector("svg"), g=fig.querySelector(".cross");
  const out=fig.querySelector(".liferead");
  const box=svg.getBoundingClientRect();
  /* SVG 는 `width` 속성과 `viewBox` 가 같은 값이라 보통 1:1 인데, 좁은 화면에서
     줄어들 수 있으므로 실제 폭으로 환산합니다. */
  const sx=(clientX-box.left)*(svg.viewBox.baseVal.width/(box.width||1));
  let best=0;
  for(let i=1;i<L.pts.length;i++)
    if(Math.abs(L.pts[i].x-sx)<Math.abs(L.pts[best].x-sx)) best=i;
  const t=L.pts[best];
  g.classList.add("on");
  g.querySelector(".cx").setAttribute("x1",t.x); g.querySelector(".cx").setAttribute("x2",t.x);
  g.querySelector(".cdot").setAttribute("cx",t.x); g.querySelector(".cdot").setAttribute("cy",t.y);
  const trade=t.mv?`<i class="${t.mv>0?"up":"down"}">${t.mv>0?tx("buy"):tx("sell")}</i> `
    +(t.mv>0?"+":"\u2212")+shortShares(Math.abs(t.mv)):"";
  out.innerHTML=`${fdate(t.q)} · ${usd(t.p)}${trade?" · "+trade:""}`;
}
function clearLife(fig){
  const g=fig.querySelector(".cross"); if(g) g.classList.remove("on");
  const out=fig.querySelector(".liferead"); if(out) out.innerHTML="";
}

function wireLife(ul){
  if(!ul) return;
  ul.querySelectorAll("figure.life").forEach(fig=>{
    const sc=fig.querySelector(".lifescroll"); if(!sc) return;
    sc.addEventListener("pointermove",e=>readLife(fig,e.clientX));
    sc.addEventListener("pointerdown",e=>readLife(fig,e.clientX));
    sc.addEventListener("pointerleave",()=>clearLife(fig));
    sc.addEventListener("pointercancel",()=>clearLife(fig));
    /* 손가락은 뗀 자리에 머무르지 않으므로 `pointerleave` 가 안 옵니다. */
    sc.addEventListener("pointerup",e=>{ if(e.pointerType!=="mouse") clearLife(fig); });
  });
  /* 기간 버튼. **한 줄에서 누르면 모든 줄이 같이 옮겨 갑니다** — 기간은 그
     종목의 성질이 아니라 보는 방법이라, 줄마다 달라지면 위아래를 견줄 수 없습니다. */
  ul.querySelectorAll(".lifeseg").forEach(seg=>{
    seg.addEventListener("click",e=>{
      const b=e.target.closest("button[data-q]");
      if(!b||b.disabled) return;
      const q=+b.dataset.q;
      if(q===LRANGE) return;
      LRANGE=q; saveRange();
      document.querySelectorAll("figure.life").forEach(drawLife);
    });
  });

  ul.querySelectorAll("details.lf").forEach(d=>{
    d.addEventListener("toggle",()=>{ if(d.open) settleLife(d); });
  });
}

/* 접혀 있는 동안은 폭이 0 이라 미리 옮길 수 없습니다. 그래서 **열리는 순간**과
   **기간을 바꾼 직후**에 이것을 부릅니다. */
function settleLife(root){
  const sc=root.querySelector(".lifescroll");
  if(!sc) return;
  sc.scrollLeft=sc.scrollWidth;
  /* **끌 수 있다는 말은 실제로 넘칠 때만 합니다.** 분기 수로 짐작하면
     좁은 화면에서는 짧은 차트도 넘치고 넓은 화면에서는 긴 차트도 안 넘칩니다.
     여기서는 이미 그려진 뒤라 그냥 재면 됩니다. */
  const h=root.querySelector(".lifesum .hint");
  if(h) h.hidden = sc.scrollWidth<=sc.clientWidth+1;
}

/* 각주. 분할 목록과 '집계 전' 종목은 자료에서 오므로 **새 분기가 들어오면
   글도 따라 바뀝니다** — 새 분할이 잡히면 저절로 실리고, 집계 전 종목을
   팔면 그 이름이 저절로 빠집니다. */
function paintFoot(B){
  const el=document.getElementById("footbody");
  if(el) el.innerHTML=tx("foot",FIRSTY,B?B.splits:null,B?B.preNames:null)
    .map(s=>`<p>${s}</p>`).join("");
}

function render(){
  const el=id=>document.getElementById(id);
  el("brand").textContent=tx("brand");
  el("tagline").textContent=tx("tagline");
  el("foothead").textContent=tx("footTitle");
  /* 각주를 두 번 그립니다. **자료가 없어도 각주는 나와야 하므로** 한 번은
     맨 앞에서 예시 없이 그리고, `build()` 뒤에 분할·집계 전 목록을 채워
     다시 그립니다. */
  paintFoot(null);
  el("legend").textContent=tx("prevTick");
  el("qhead").textContent=tx("quarterHead");
  if(!RAW){ el("stamp").textContent=LOADED?tx("noData"):""; return; }

  FIRSTY=String(RAW.quarters[0].period).slice(0,4);
  const B=build(), T=tallyOf(B);
  paintFoot(B);
  el("stamp").innerHTML=`${tx("asOf",fdate(B.cur.period))}<br>${tx("filedOn",fdate(B.cur.filed))}`;

  /* 직전 분기가 없으면 비교할 대상이 없다. 그대로 그리면 전 종목이 '신규'로
     찍혀 거짓말이 되므로 이번 분기 칸을 통째로 접는다. */
  if(!B.prv){ el("quarter").hidden=true; }
  else{
  el("tally").innerHTML=[
    ["kNew",T.nw,"up"],["kAdd",T.add,"up"],["kTrim",T.trim,"down"],
    ["kHold",T.hold,""],["kOut",T.out,"down"]
  ].map(([k,n,c])=>`<div class="${n?c:""}"><span class="n">${n}</span><span class="k">${tx(k)}</span></div>`).join("");
  el("says").innerHTML=says(B,T).map(s=>`<p>${s}</p>`).join("");

  /* 사건은 접히지 않는다. 이번 분기 신규가 26위($400만)라 크기로 접으면 사라진다. */
  const evs=[];
  for(const r of B.list.filter(x=>x.isNew))
    evs.push(`<div class="ev in"><span class="tag">${r.back?tx("evBack"):tx("evNew")}</span><span class="nm">${title(r.name)}</span><span class="sub">${money(r.value)}</span></div>`);
  for(const r of B.out)
    evs.push(`<div class="ev out"><span class="tag">${tx("evOut")}</span><span class="nm">${title(r.name)}</span><span class="sub">${tx("heldFor")} ${tx("yr",Math.round(r.years*10)/10)} · ${money(r.value)}</span></div>`);
  el("events").innerHTML=evs.join("");
  el("events").hidden=!evs.length;
  el("quarter").hidden=false;
  }

  /* 목록 */
  el("bookhead").textContent=`${tx("positions",B.list.length)} · ${money(B.tc)}`;
  el("bookcap").textContent=tx("costArrow",fdate(B.cur.period));
  /* 열 이름은 **줄마다 되풀이하지 않고 머리에 한 번만** 적습니다 — 26줄이면
     같은 말이 78번 나오고, 라벨이 숫자보다 자리를 더 차지합니다(4번 성적표에서
     이미 같은 판단을 했습니다). 줄마다 바뀌는 `BUY`/`SELL` 만 줄 안에 둡니다. */
  el("c1").textContent=tx("colShares");
  el("c2").textContent=tx("colQtr");
  el("c3").textContent=tx("colRet");
  el("c4").textContent=tx("colVal");
  /* 상위 10종목을 펴고 **나머지는 접습니다 — 지우는 것이 아닙니다.**
     전체 종목 수와 총액은 제목에 그대로 둡니다 — 10개가 전부인 것처럼 보이면
     화면이 거짓말을 합니다. 막대 폭은 접힌 줄도 1위 기준으로 그려서, 펼쳤을 때
     위아래가 같은 자로 읽힙니다. */
  const maxW=B.list[0]?B.list[0].w:1;
  const top=B.list.slice(0,10), rest=B.list.slice(10);
  /* `chartHTML` 이 여기서 좌표를 쌓으므로 그리기 직전에 비웁니다 — 언어를
     바꿀 때도 `render()` 가 다시 도니까 안 비우면 계속 불어납니다. */
  LIFES=[];
  el("top").innerHTML=top.map((r,i)=>rowHTML(r,i+1,maxW)).join("");
  el("rest").innerHTML=rest.map((r,i)=>rowHTML(r,i+11,maxW)).join("");
  wireLife(el("top")); wireLife(el("rest"));
  const shown=top.reduce((s,r)=>s+r.value,0)/B.tc*100;
  const fold=el("fold");
  if(rest.length){
    const share=rest.reduce((s,r)=>s+r.value,0)/B.tc*100;
    const a=rest.filter(r=>!r.isNew&&!r.flat&&r.dsh>0).length;
    const t=rest.filter(r=>!r.isNew&&!r.flat&&r.dsh<0).length;
    el("foldttl").textContent=tx("foldOpen",rest.length);
    el("foldwhy").textContent=tx("foldNote",pct(share),a,t);
    fold.hidden=false;
    /* **펼치면 '상위 10종목만' 이 거짓말이 됩니다.** 접힘을 열어 둔 채로 그 줄을
       그대로 두면 화면이 자기 말을 어깁니다. 여는 순간 문장을 바꿉니다. */
    const cut=()=>el("bookcut").textContent=
      fold.open?tx("allShown",B.list.length):tx("topOnly",top.length,pct(shown));
    cut(); fold.ontoggle=cut;
  }else{
    fold.hidden=true; fold.open=false; fold.ontoggle=null;
    el("bookcut").textContent="";
  }
  el("book").hidden=false;
}

function applyLang(lang,remember){
  LANG=D[lang]?lang:"en"; L10N=D[LANG]; LOCALE=pickLocale(LANG);
  if(remember){ try{ localStorage.setItem("dt.lang",LANG) }catch(e){} }
  const r=document.documentElement;
  r.setAttribute("lang",LANG); r.setAttribute("dir",L10N.dir||"ltr");
  const p=REDUP.has(LANG)?PAL.redUp:PAL.greenUp;
  r.style.setProperty("--up",p.up); r.style.setProperty("--down",p.down);
  r.style.setProperty("--up-rgb",p.upRGB); r.style.setProperty("--down-rgb",p.downRGB);
  document.title=tx("docTitle");
  paintHead(); paintTabs(); render();
}
function paintHead(){
  const set=(sel,attr,val)=>{const e=document.head.querySelector(sel);if(e)e.setAttribute(attr,val)};
  const t=tx("docTitle"),d=tx("metaDesc");
  set('meta[name="description"]',"content",d);
  set('meta[property="og:title"]',"content",t);
  set('meta[property="og:description"]',"content",d);
  set('meta[property="og:locale"]',"content",LANG==="ko"?"ko_KR":"en_US");
  set('meta[property="og:locale:alternate"]',"content",LANG==="ko"?"en_US":"ko_KR");
  const c=document.head.querySelector('link[rel="canonical"]');
  if(c){ let u="https://itpaidoff.com/titans/berkshire/";
    try{ if(new URLSearchParams(location.search).get("lang")) u+="?lang="+LANG; }catch(e){}
    c.setAttribute("href",u); }
}
/* 언어를 바꾸면 글자가 바뀌므로 탭은 비우고 다시 그린다(본 사이트와 같은 예외). */
function paintTabs(){
  const box=document.getElementById("langtabs");
  box.innerHTML=Object.keys(D).map(k=>
    `<button type="button" data-lang="${k}" aria-pressed="${k===LANG}">${D[k].tab}</button>`).join("");
}
document.getElementById("langtabs").addEventListener("click",e=>{
  const b=e.target.closest("button[data-lang]"); if(!b)return;
  applyLang(b.dataset.lang,true);
  try{ if(window.track) track("lang",{lang:LANG}); }catch(err){}
});

/* 곁들이 표 둘(티커·섹터)은 있으면 좋고 없어도 그만입니다 — 못 받으면 그 줄만
   글자 타일이 되고 섹터 자리가 빌 뿐입니다. 그래서 따로 받고, 실패를 화면에
   알리지 않습니다. 공시(berkshire.json)만이 없으면 안 되는 파일입니다. */
const side=(url,take)=>fetch(url,{cache:"no-store"})
  .then(r=>r.ok?r.json():null)
  .then(j=>{
    if(j&&typeof j==="object")
      /* `_` 로 시작하는 키는 사람이 보라고 넣어 둔 것입니다(마지막으로 물어본 날). */
      for(const k in j) if(k[0]!=="_"&&j[k]) take(k,j[k]);
  })
  .catch(()=>{});

Promise.all([
  side("../../data/titans/tickers.json",(k,v)=>{ if(typeof v==="string") TICKERS[k]=v; }),
  side("../../data/titans/sectors.json",(k,v)=>{ if(v&&typeof v==="object") SECTORS[k]=v; }),
]).finally(()=>{
  fetch("../../data/titans/berkshire.json",{cache:"no-store"})
    .then(r=>r.ok?r.json():null)
    .then(j=>{ RAW=(j&&Array.isArray(j.quarters)&&j.quarters.length)?j:null; })
    .catch(()=>{ RAW=null; })
    .finally(()=>{ LOADED=true; applyLang(pickLang(),false); });
});

/* 지난번에 고른 기간을 **첫 그림 전에** 읽습니다 — 뒤에 읽으면 전체로 한 번
   그렸다가 바뀌어 화면이 깜빡입니다. 값이 이상하면 그냥 전체로 갑니다. */
loadRange();
applyLang(pickLang(),false);
setTimeout(()=>document.body.classList.add("settled"),1600);
</script>
