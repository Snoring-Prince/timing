<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Olympics share card source</title>
<!-- 공유 그림(olympics/og.png)의 원본입니다. 고친 뒤 node scripts/og/bake.cjs olympics 로 다시 굽습니다.
     미리보기 수집기는 JS 를 거의 안 돌리고 ?lang= 과 무관하게 같은 HTML 을 받으므로 한 장에 두 언어를 둡니다.
     숫자(수익률·순위)는 넣지 않습니다 — 자료가 매주 바뀌어 그림이 곧 거짓말이 됩니다.
     인물 색은 올림픽 화면의 --john…--emma 와 같은 '누구'의 색이며 상승·하락색이 아닙니다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{--ink:#182132;--muted:#475765;--faint:#626a78;--rule:#e2dcec;--tint:#f3eff8;--accent:#7250a2;
  --john:#687b91;--daniel:#224ddb;--samuel:#27634d;--alicia:#ac481c;--emma:#7250a2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Pretendard Variable",Pretendard,sans-serif;background:var(--tint);color:var(--ink);
  display:grid;grid-template-columns:1fr 520px;gap:40px;padding:60px 64px}
.left{display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:800;letter-spacing:-1px}
.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--daniel);color:#fff;font-size:24px}
.eyebrow{margin-top:44px;font-size:24px;font-weight:700;color:var(--accent)}
h1{margin-top:10px;font-size:66px;line-height:1.16;font-weight:800;letter-spacing:-2.5px}
.en{margin-top:16px;font-size:28px;font-weight:600;color:var(--muted);letter-spacing:-.5px}
.ask{margin-top:auto;font-size:34px;font-weight:800;letter-spacing:-1px;color:var(--accent)}
.ask span{display:block;margin-top:4px;font-size:24px;font-weight:600;letter-spacing:-.3px}
.panel{background:#fff;border-radius:24px;padding:30px 34px 26px;display:flex;flex-direction:column}
.marks{display:grid;grid-template-columns:132px 1fr;font-size:17px;font-weight:700;color:var(--faint);letter-spacing:.5px}
.marks div{display:flex;justify-content:space-between}
.lane{display:grid;grid-template-columns:132px 1fr;align-items:center;height:82px;border-top:1px solid var(--rule)}
.lane:first-of-type{border-top:0}
.who b{display:block;font-size:30px;font-weight:800;letter-spacing:-1px;color:var(--c)}
.who i{display:block;font-style:normal;font-size:18px;font-weight:600;color:var(--faint)}
.track{position:relative;height:100%;border-left:3px solid var(--ink);border-right:3px dashed #b9b0c8}
.track:before{content:"";position:absolute;left:0;top:50%;width:22px;height:22px;margin:-11px 0 0 -12px;border-radius:50%;background:var(--c)}
.track:after{content:"";position:absolute;left:18px;right:22px;top:50%;border-top:3px dashed var(--c);opacity:.45}
.foot{margin-top:auto;padding-top:10px;text-align:right;font-size:18px;font-weight:600;color:var(--faint)}
</style>
</head>
<body>
<section class="left">
  <div class="brand"><span class="mark">↗</span>itpaidoff.</div>
  <p class="eyebrow">투자 올림픽 · Investment Olympics</p>
  <h1>같은 돈,<br>다섯 가지 선택.</h1>
  <p class="en">Same cash. Five different choices.</p>
  <p class="ask">누가 앞서게 됐을까?<span>Who pulled ahead?</span></p>
</section>
<section class="panel">
  <div class="marks"><span></span><div><span>출발 START</span><span>?</span></div></div>
  <div class="lane" style="--c:var(--john)"><p class="who"><b>존</b><i>John</i></p><div class="track"></div></div>
  <div class="lane" style="--c:var(--daniel)"><p class="who"><b>다니엘</b><i>Daniel</i></p><div class="track"></div></div>
  <div class="lane" style="--c:var(--samuel)"><p class="who"><b>사무엘</b><i>Samuel</i></p><div class="track"></div></div>
  <div class="lane" style="--c:var(--alicia)"><p class="who"><b>알리시아</b><i>Alicia</i></p><div class="track"></div></div>
  <div class="lane" style="--c:var(--emma)"><p class="who"><b>엠마</b><i>Emma</i></p><div class="track"></div></div>
  <p class="foot">itpaidoff.com/olympics</p>
</section>
</body>
</html>
