# 대가들의 선택 — 13F 정정 공시(13F-HR/A) 정찰
#
# 개발 환경에서는 SEC 에 닿지 않습니다(프록시가 끊습니다 — 2026-09-20 재확인).
# 러너에서는 됩니다. 그래서 **정정이 어떻게 생겼는지를 짐작해서 병합 규칙을
# 만들지 않고**, 여기서 한 번 받아 원본을 아티팩트로 올려 둡니다.
# 그것을 읽은 뒤에 규칙을 설계합니다. probe-sec.yml 과 같은 요령입니다.
#
# 예약 실행은 없습니다. Actions 탭에서 손으로 누를 때만 돕니다.
# 저장소에 아무것도 커밋하지 않습니다(`contents: read`).
name: Probe Amendments

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "투자자 (data/titans/<slug>.json)"
        required: false
        default: "berkshire"
      since:
        description: "이 기준일 이후 분기만 (기본 2013-04-01 = XML 시대)"
        required: false
        default: "2013-04-01"
      limit:
        description: "분기를 이 개수까지만 (0 이면 전부)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 비밀값이 없으면 여기서 종료코드 1 로 끝납니다. probe-sec.yml ·
      # notify.py --test 와 같은 이유입니다 — 손으로 돌린 것은 "되는지 확인해
      # 달라"는 뜻이라, 조용히 넘어가면 초록불인데 빈손이 됩니다.
      - name: 정찰
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          # 입력값을 명령줄에 바로 끼워 넣지 않습니다. 손으로 적는 칸이라
          # 따옴표 하나로 셸 명령이 되는 자리입니다.
          SLUG: ${{ inputs.slug }}
          SINCE: ${{ inputs.since }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -o pipefail
          python -u scripts/probe_amendments.py \
            --slug "$SLUG" --since "$SINCE" --limit "$LIMIT" 2>&1 \
            | tee amend-probe-console.log

      # 실패해도 받아 온 데까지는 올립니다. 무엇을 받다 막혔는지가 곧 답입니다.
      - name: 원본 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amend-probe
          path: |
            amend-probe/
            amend-probe-console.log
          if-no-files-found: warn
          retention-days: 14
