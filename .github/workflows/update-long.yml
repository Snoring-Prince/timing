name: Update long history

on:
  # 주 1회면 충분하다. 10년·20년 그래프에서 며칠 늦은 것은 눈에 띄지 않고,
  # 큰 파일을 매일 커밋하면 저장소가 무거워진다.
  # 백테스트와 30분 띄워 둔다 — 야후를 같은 시각에 두 번 두드리지 않게.
  schedule:
    - cron: "30 23 * * 6"
  # Actions 탭에서 손으로 실행할 수 있게 하는 버튼
  workflow_dispatch:

permissions:
  contents: write

jobs:
  long:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 장기 이력 받기
        id: collect
        continue-on-error: true
        run: python scripts/fetch_long.py

      - name: 방문자용 데이터 생성
        run: python scripts/publish_dashboard.py market-long.json

      # 사무엘 화면의 한영 예시 문단. 실패해도 가격 저장과 올림픽 갱신은 막지 않는다 —
      # 그 둘이 읽는 것은 검증을 거쳐 저장된 가격이지 이 문단이 아니다(2026-11-23 검수).
      # 실패하면 기준일이 적힌 지난 문단이 그대로 남고, 아래에서 따로 알린다.
      - name: 사무엘의 한영 비교 예시 갱신
        id: samuel
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/publish_samuel_example.cjs 2>&1 | tee samuel-example.log

      - name: 결과 저장
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 가격은 예시 문단과 상관없이 저장한다. 수집기가 이미 검증한 것만 파일에 쓴다.
          git add data/market-long.json data/dashboard/market-long.json data/samuel/prices.json
          if [ "${{ steps.samuel.outcome }}" = success ]; then
            git add samuel/index.html
          fi
          if ! git diff --staged --quiet -- data/samuel/prices.json samuel/index.html; then
            sed -i "s#<lastmod>[^<]*</lastmod><!-- samuel -->#<lastmod>$(date -u +%Y-%m-%d)</lastmod><!-- samuel -->#" sitemap.xml
            git add sitemap.xml
          fi
          if git diff --staged --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "장기 이력 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi

      # 성공한 계열을 먼저 저장한 뒤 실패를 복원해 알림과 Actions 상태에 남긴다.
      - name: 수집 실패 상태 반영
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1

      # 실패하면 텔레그램으로. 이 프로젝트에서 진짜 위험한 것은 터지는 것이 아니라
      # **데이터가 조용히 끊기는 것**입니다(Stooq 차단, CNN 418 — 둘 다 겪었습니다).
      # 비밀값이 없으면 조용히 넘어가고, 알림 실패가 실행을 실패시키지도 않습니다.
      - name: 실패하면 텔레그램으로
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python scripts/notify.py --title "장기 이력 받기가 실패했습니다"

      # 예시 문단만 실패한 경우. 받기는 성공했으므로 위의 제목을 쓰지 않는다 —
      # 거짓 경보가 섞이면 진짜 고장이 묻힌다(CLAUDE.md 6-2).
      - name: 사무엘 예시만 실패하면 텔레그램으로
        if: always() && steps.samuel.outcome == 'failure'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COLLECT: ${{ steps.collect.outcome }}
          SAVE: ${{ steps.save.outcome }}
        run: |
          {
            echo "사무엘 화면의 예시 문단만 지난 기준일 그대로입니다."
            if [ "$COLLECT" = success ] && [ "$SAVE" = success ]; then
              echo "가격은 저장했고 올림픽 갱신도 이어서 돕니다."
            else
              echo "다른 단계도 실패했습니다 — '장기 이력 받기가 실패했습니다' 알림을 같이 보세요."
            fi
            echo
            tail -n 20 samuel-example.log 2>/dev/null || true
            echo
            echo "실행 기록: $RUN_URL"
          } > samuel-alert.txt
          python scripts/notify.py --title "사무엘 비교 예시 갱신 실패" --body-file samuel-alert.txt

  olympics:
    needs: long
    uses: ./.github/workflows/update-olympics.yml
    secrets: inherit
