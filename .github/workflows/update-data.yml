name: Update market data

on:
  # 평일 22:00 UTC = 한국시간 다음날 07:00 (미국장 마감 뒤)
  schedule:
    - cron: "0 22 * * 1-5"
  # Actions 탭에서 손으로 실행할 수 있게 하는 버튼
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 데이터 받아오기
        id: collect
        continue-on-error: true
        run: python scripts/fetch_data.py

      - name: 바뀐 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --staged --quiet; then
            echo "바뀐 내용 없음"
          else
            # 데이터가 실제로 바뀐 날에만 사이트맵 날짜를 오늘로 옮긴다.
            # 박아 두면 곧 거짓말이 되고, 구글은 못 믿을 lastmod 를 아예 무시한다.
            # 안 바뀐 날에도 찍으면 "매일 바뀐다"는 거짓 신호가 된다.
            # 표식이 붙은 자기 줄만 옮긴다. 표식 없이 갈면 분기마다 바뀌는
            # titans 줄까지 매일 찍혀 "매일 바뀐다"는 거짓 신호가 된다.
            sed -i "s#<lastmod>[^<]*</lastmod><!-- root -->#<lastmod>$(date -u +%Y-%m-%d)</lastmod><!-- root -->#" sitemap.xml
            git add sitemap.xml
            git commit -m "데이터 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi

      # 성공한 계열을 먼저 저장한 뒤 실패를 복원해 알림과 Actions 상태에 남긴다.
      - name: 수집 실패 상태 반영
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1

      # 실패하면 텔레그램으로. 이 프로젝트에서 진짜 위험한 것은 터지는 것이 아니라
      # **데이터가 조용히 끊기는 것**입니다(Stooq 차단, CNN 418 — 둘 다 겪었습니다).
      # 비밀값이 없으면 조용히 넘어가고, 알림 실패가 실행을 실패시키지도 않습니다.
      - name: 실패하면 텔레그램으로
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python scripts/notify.py --title "매일 데이터 받기가 실패했습니다"
