name: Update Titans Prices

on:
  schedule:
    # After 20:00 New York in both DST and standard time; includes Saturday refresh.
    - cron: "23 2 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: titans-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 일별 종가 받기
        id: fetch
        run: python -u scripts/fetch_prices.py
      # A partial failure preserves and saves successful updates, then fails visibly.
      # Rebase handles another data workflow committing while this job downloaded.
      - name: 가격 저장
        if: always() && steps.fetch.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/titans/prices.json
          if ! git diff --staged --quiet; then
            git commit -m "일별 종가 갱신 $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
