# 대가들의 선택 — 2013년 이전 13F 원본을 임시 브랜치에 올립니다.
#
# **한 번만 돌리고 지울 워크플로입니다.** 예약 없음, 손으로만.
#
# 왜 브랜치인가: 어시스턴트가 SEC 에 직접 못 닿고(프록시 차단), 5MB 를
# 실행 로그로 읽기엔 너무 크고, 아티팩트 내려받기 주소도 막혀 있습니다.
# 저장소 브랜치에 올려 두면 그냥 받아서 읽을 수 있습니다.
#
# 13F 는 미국 정부 저작물이라 퍼블릭 도메인입니다.
#
# 정리가 끝나면 이 워크플로와 scripts/dump_13f_raw.py 와 브랜치를 다 지웁니다.
name: Dump 13F raw

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "원본을 올릴 브랜치 이름"
        required: false
        default: "raw-13f"
      limit:
        description: "시험용으로 앞 N건만 (0 = 전부)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 원본 내려받기
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          LIMIT: ${{ inputs.limit }}
        run: python scripts/dump_13f_raw.py --out sec-raw --limit "${LIMIT:-0}"

      # 부모 없는 브랜치로 만듭니다 — main 의 파일이 딸려 가지 않습니다.
      # 받은 것만 담기고, 다음에 다시 돌리면 통째로 갈아끼웁니다.
      - name: 브랜치로 올리기
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -o pipefail
          B="${BRANCH:-raw-13f}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$B"
          git rm -rf --cached . >/dev/null
          git add -f sec-raw
          git commit -q -m "13F 원본 (2013년 이전) $(date -u +%Y-%m-%d)"
          git push -f origin "$B"
          echo "브랜치 $B 에 올렸습니다."

      - name: 실패하면 텔레그램으로
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python scripts/notify.py --title "13F 원본 내려받기가 실패했습니다"
