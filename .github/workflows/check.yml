# 설명 글(.about)의 숫자를 고칠 때 한쪽 언어만 고치는 실수를 PR 에서 잡습니다.
# 주 1회 백테스트 워크플로도 같은 검사를 돌리지만, 그때는 이미 머지된 뒤입니다.
name: Check

on:
  pull_request:
    paths:
      - "index.html"
      - "data/backtest.json"
      - "scripts/check_about.py"
      - "scripts/notify.py"
      - "scripts/backtest.py"
      - "scripts/fetch_data.py"
      - "scripts/fetch_long.py"
      - "scripts/tests/test_dashboard.py"
      - "scripts/tests/dashboard.test.cjs"
      - "scripts/tests/live.test.cjs"
      - "scripts/tests/test_dashboard_publish.py"
      - "scripts/publish_dashboard.py"
      - "workers/live.js"
      - "data/dashboard/**"
      - "data/market.json"
      - "data/market-long.json"
      - ".github/workflows/check.yml"
      - ".github/workflows/update-data.yml"
      - ".github/workflows/update-long.yml"
      - ".github/workflows/update-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 대시보드 기간 계산과 수집 실패 검사
        run: python -m unittest discover -s scripts/tests -p 'test_dashboard*.py'

      - name: 대시보드 날짜·결측·실시간 갱신 검사
        run: node --test scripts/tests/dashboard.test.cjs scripts/tests/live.test.cjs

      - name: 설명 글 숫자 대조
        run: python scripts/check_about.py

      # 손으로 돌렸다면 알림 경로까지 확인하고 싶다는 뜻이다. 켜고 끄는 체크박스를
      # 뒀더니 안 켜고 돌려서, 초록불인데 아무것도 안 오는 일이 실제로 있었다.
      # PR 에서는 안 보낸다 — 화면에 빨간 X 로 바로 보이고, 리뷰마다 울릴 이유가 없다.
      - name: 텔레그램 시험 발송
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python scripts/notify.py --test
