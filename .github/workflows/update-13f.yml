name: Update 13F

on:
  schedule:
    # SEC의 최신 제출 목록만 확인하는 가벼운 감시입니다. 새 접수번호가 있을 때만
    # 원문과 과거 목록을 받습니다. 미국 동부 평일의 오전·저녁을 넓게 덮습니다.
    - cron: "15 12,23 * * 1-5"
    # 최신 목록에서 놓친 경우와 수동 복구를 위한 주 1회 전체 점검입니다.
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-13f
  cancel-in-progress: false

jobs:
  titans:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 새 공시 감시 및 수집
        id: fetch
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -o pipefail
          mode=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_SCHEDULE" = "0 1 * * 0" ]; then
            mode=(--verify-all)
          fi
          python -u scripts/watch_13f.py "${mode[@]}" 2>&1 | tee 13f-fetch.log

      - name: 공시 결과 저장
        id: save
        if: always() && steps.fetch.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/titans/*.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "바뀐 공시 없음"
          else
            sed -i "s#<lastmod>[^<]*</lastmod><!-- titans -->#<lastmod>$(date -u +%Y-%m-%d)</lastmod><!-- titans -->#" sitemap.xml
            git add sitemap.xml
            git commit -m "13F 갱신 $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 정정 공시가 떴으면 텔레그램으로
        if: always() && hashFiles('amend-alert.txt') != ''
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          python scripts/notify.py \
            --title "13F 정정 공시가 떴습니다" \
            --body-file amend-alert.txt
          rm -f amend-alert.txt

      # 아래 둘은 화면의 이름표와 로고를 보강하는 작업입니다. 실제 공시가 바뀐
      # 날에만 돌며, 실패해도 이미 받은 13F 저장을 되돌리지 않습니다.
      - name: 티커 받기 (로고용)
        id: tickers
        if: steps.save.outputs.changed == 'true'
        continue-on-error: true
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          set -o pipefail
          python -u scripts/fetch_tickers.py 2>&1 | tee ticker-fetch.log

      - name: 티커 저장
        id: save_tickers
        if: steps.save.outputs.changed == 'true'
        continue-on-error: true
        run: |
          git add data/titans/tickers.json
          if ! git diff --staged --quiet; then
            git commit -m "티커 갱신 $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: 섹터 받기 (업종 이름표)
        id: sectors
        if: steps.save.outputs.changed == 'true'
        continue-on-error: true
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          set -o pipefail
          python -u scripts/fetch_sectors.py 2>&1 | tee sector-fetch.log

      - name: 섹터 저장
        id: save_sectors
        if: steps.save.outputs.changed == 'true'
        continue-on-error: true
        run: |
          git add data/titans/sectors.json
          if ! git diff --staged --quiet; then
            git commit -m "섹터 갱신 $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi

      - name: 공시 감시나 저장이 실패하면 텔레그램으로
        if: failure() && (steps.fetch.outcome == 'failure' || steps.save.outcome == 'failure')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          tail -n 30 13f-fetch.log > 13f-error.txt 2>/dev/null || true
          python scripts/notify.py \
            --title "13F 자동 갱신이 실패했습니다" \
            --body-file 13f-error.txt

      - name: 티커나 업종 보강이 실패하면 텔레그램으로
        if: >-
          always() && (steps.tickers.outcome == 'failure' ||
          steps.save_tickers.outcome == 'failure' ||
          steps.sectors.outcome == 'failure' ||
          steps.save_sectors.outcome == 'failure')
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: |
          {
            echo "ticker fetch: ${{ steps.tickers.outcome }}"
            echo "ticker save: ${{ steps.save_tickers.outcome }}"
            echo "sector fetch: ${{ steps.sectors.outcome }}"
            echo "sector save: ${{ steps.save_sectors.outcome }}"
            tail -n 12 ticker-fetch.log 2>/dev/null || true
            tail -n 12 sector-fetch.log 2>/dev/null || true
          } > 13f-aux-error.txt
          python scripts/notify.py \
            --title "13F 티커·업종 보강이 실패했습니다" \
            --body-file 13f-aux-error.txt
