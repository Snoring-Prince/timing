# 대가들의 선택 — 13F 공시를 받아 저장소에 JSON 으로 둡니다.
#
# 공시는 분기마다 한 번, 분기 끝나고 45일 뒤에 나옵니다(2·5·8·11월 중순).
# 그런데 **하루 차이로 놓치면 다음 분기까지 석 달을 기다립니다.** 스크립트가
# 이미 받은 분기는 건너뛰므로 자주 돌아도 싸고, 새 것이 없으면 커밋도
# 안 합니다. 그래서 날짜를 정확히 맞히려 들지 않고 주 1회 돌립니다.
#
# 야후·백테스트와 시각을 겹치지 않게 띄웠습니다(일요일).
name: Update 13F

on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  titans:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 비밀값이 없으면 종료코드 1 로 끝납니다. SEC 는 이름 없는 요청을
      # 거절하므로 연락처 없이는 아무것도 받을 수 없습니다.
      - name: 13F 받기
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python scripts/fetch_13f.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/titans/berkshire.json
          if git diff --staged --quiet; then
            echo "바뀐 내용 없음 — 새 분기가 아직 안 나왔습니다"
          else
            # 새 분기가 실제로 들어온 날에만 사이트맵의 titans 줄을 옮긴다.
            # 표식(<!-- titans -->) 덕분에 root 줄은 건드리지 않는다.
            sed -i "s#<lastmod>[^<]*</lastmod><!-- titans -->#<lastmod>$(date -u +%Y-%m-%d)</lastmod><!-- titans -->#" sitemap.xml
            git add sitemap.xml
            git commit -m "13F 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi

      # 로고를 찾는 데 쓰는 티커입니다. **공시를 저장한 뒤에 돌립니다** —
      # 티커를 못 받는다고 13F 데이터까지 안 올라가면 곤란합니다(6-2 의
      # "데이터를 먼저 커밋하고 그 뒤에 본다"와 같은 순서).
      #
      # 화면은 미국 종목의 ISIN 을 CUSIP 에서 직접 계산하므로 이 표가 필요한 것은
      # 미국 발행사가 아닌 종목뿐입니다(28년치의 5.8%). 이미 물어본 것은 다시
      # 묻지 않으므로 보통은 요청이 0건이고 파일도 안 바뀝니다.
      # **이 두 단계는 실행을 실패시키지 않습니다**(continue-on-error).
      # 티커는 로고를 찾는 데만 쓰는 곁가지라, 못 받으면 그 종목의 마크가
      # 글자 타일로 떨어질 뿐 데이터는 멀쩡합니다. 그런데 처음에는 이 단계가
      # 실행 전체를 빨갛게 만들고 **"13F 받기가 실패했습니다"** 라는 텔레그램까지
      # 보냈습니다 — 정작 13F 는 성공해서 커밋된 뒤였습니다. 거짓 경보입니다.
      # 아래 알림은 이제 진짜 13F 실패일 때만 울립니다.
      - name: 티커 받기 (로고용)
        continue-on-error: true
        # SEC 는 이름 없는 요청을 거절합니다. 없으면 SEC 대조만 건너뛰고
        # OpenFIGI 쪽은 그대로 돕니다(13F 받기와 같은 비밀값입니다).
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        # -u 로 버퍼링을 끕니다. 없으면 표준출력이 뭉쳐 나와서 **오류 줄이
        # 결과 목록보다 먼저 찍힙니다** — 첫 실행 로그가 실제로 그랬습니다.
        run: python -u scripts/fetch_tickers.py

      - name: 티커 저장
        continue-on-error: true
        run: |
          git add data/titans/tickers.json
          if git diff --staged --quiet; then
            echo "티커 표에 바뀐 내용 없음"
          else
            git commit -m "티커 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi

      # 이 프로젝트에서 진짜 위험한 것은 터지는 것이 아니라 **데이터가 조용히
      # 끊기는 것**입니다(CLAUDE.md 6-2). 비밀값이 없으면 notify.py 는
      # 조용히 넘어가고, 알림 실패가 실행을 실패시키지도 않습니다.
      - name: 실패하면 텔레그램으로
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python scripts/notify.py --title "13F 받기가 실패했습니다"
